<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLA Forge First Admin Setup</title><link rel="stylesheet" href="assets/forge.css?v=0184"></head>
<body class="forge-login-body"><div class="forge-login-shell"><div class="forge-login-card"><h2>First Admin Setup</h2><p>Run this once after applying D1 schema v2 and Worker v3.</p>
<label>Existing Forge Admin Password<input id="bootOld" type="password"></label>
<label>Your Name<input id="bootName"></label>
<label>Email<input id="bootEmail" type="email"></label>
<label>New Employee Password<input id="bootPass" type="password"></label>
<div id="bootStatus"></div><button class="btn forge-login-btn" id="bootBtn">Create First Administrator</button></div></div>
<script>
document.querySelector('#bootBtn').onclick=async()=>{
 const out=document.querySelector('#bootStatus'),btn=document.querySelector('#bootBtn');btn.disabled=true;
 try{
  const r=await fetch('https://pla-forge-api.plapalsuk.workers.dev/auth/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   bootstrap_password:document.querySelector('#bootOld').value,name:document.querySelector('#bootName').value,email:document.querySelector('#bootEmail').value,password:document.querySelector('#bootPass').value
  })});const d=await r.json();if(!r.ok)throw new Error(d.error||'Setup failed');out.innerHTML='<p style="color:#65e39a">Administrator created. Delete bootstrap.html from GitHub and go to login.html.</p>';
 }catch(e){out.innerHTML='<p style="color:#ff858a">'+e.message+'</p>';btn.disabled=false}
}
</script></body></html>
